    price: 280,
    category: "Dairy",
    description: "Creamy butter for bread and cooking.",
    image: "https://placehold.co/600x400/fff3d6/795b00?text=Butter",
    alt: "Butter package"
  },
  {
    id: 3,
    name: "Tata Salt (1kg)",
    price: 28,
    category: "Groceries",
    description: "Iodized salt for everyday cooking.",
    image: "https://placehold.co/600x400/f0f0f0/444444?text=Salt",
    alt: "Table salt package"
  },
  {
    id: 4,
    name: "Parle-G Biscuits",
    price: 10,
    category: "Snacks",
    description: "Classic biscuits for tea time.",
    image: "https://placehold.co/600x400/fff0d7/80521d?text=Biscuits",
    alt: "Biscuit packet"
  },
  {
    id: 5,
    name: "Maggi Noodles",
    price: 14,
    category: "Snacks",
    description: "Instant noodles for a quick meal.",
    image: "https://placehold.co/600x400/fff0e5/b52b22?text=Noodles",
    alt: "Instant noodle packet"
  },
  {
    id: 6,
    name: "Coca-Cola (750ml)",
    price: 40,
    category: "Beverages",
    description: "Soft drink for refreshments.",
    image: "https://placehold.co/600x400/ffe8e8/aa2020?text=Soft+Drink",
    alt: "Soft drink bottle"
  },
  {
    id: 7,
    name: "Amul Milk (1L)",
    price: 68,
    category: "Dairy",
    description: "Milk for tea, coffee and breakfast.",
    image: "https://placehold.co/600x400/e9f3ff/174b83?text=Milk",
    alt: "Milk package"
  },
  {
    id: 8,
    name: "Fortune Sunflower Oil (1L)",
    price: 145,
    category: "Groceries",
    description: "Cooking oil for daily food preparation.",
    image: "https://placehold.co/600x400/fff6d9/775500?text=Cooking+Oil",
    alt: "Sunflower cooking oil bottle"
  },
  {
    id: 9,
    name: "Lays Classic Chips",
    price: 20,
    category: "Snacks",
    description: "Crunchy potato chips for snack time.",
    image: "https://placehold.co/600x400/fff1df/8a4a18?text=Chips",
    alt: "Potato chips packet"
  },
  {
    id: 10,
    name: "Bisleri Water (1L)",
    price: 20,
    category: "Beverages",
    description: "Packaged drinking water.",
    image: "https://placehold.co/600x400/e6f5ff/155b86?text=Water",
    alt: "Packaged drinking water bottle"
  }
];

/* ====================================================
   3. CART STORAGE
   ==================================================== */

const CART_KEY = "vikas_patel_store_cart_v1";

function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem(CART_KEY) || "{}");
    const clean = {};

    for (const [id, quantity] of Object.entries(saved)) {
      const product = PRODUCTS.find(p => p.id === Number(id));

      if (
        product &&
        Number.isInteger(quantity) &&
        quantity > 0 &&
        quantity <= 99
      ) {
        clean[id] = quantity;
      }
    }

    return clean;
  } catch {
    return {};
  }
}

let cart = loadCart();
let activeCategory = "All";

function saveCart() {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  } catch {
    console.warn("Cart storage is unavailable in this browser.");
  }
}

function getProduct(id) {
  return PRODUCTS.find(p => p.id === Number(id));
}

function money(amount) {
  return new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  }).format(amount);
}

function getCartCount() {
  return Object.values(cart).reduce((sum, qty) => sum + qty, 0);
}

function getCartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const product = getProduct(id);
    return sum + (product ? product.price * qty : 0);
  }, 0);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

/* ====================================================
   4. INITIAL SHOP DETAILS
   ==================================================== */

function setupShop() {
  document.title = SHOP.name + " | Online Shopping";

  document.getElementById("shopName").textContent = SHOP.name;
  document.getElementById("shopTagline").textContent = SHOP.tagline;

  document.getElementById("shopLocation").textContent =
    "📍 " + SHOP.location;

  document.getElementById("footerShopName").textContent = SHOP.name;

  document.getElementById("contactLocation").textContent =
    "📍 " + SHOP.location;

  document.getElementById("contactEmail").textContent = SHOP.email;

  document.getElementById("year").textContent =
    new Date().getFullYear();

  const phoneLink = document.getElementById("contactPhone");

  phoneLink.textContent = SHOP.phone;
  phoneLink.href = "tel:+" + SHOP.phone.replace(/\D/g, "");

  const whatsapp = document.getElementById("whatsappFloat");

  whatsapp.href =
    "https://wa.me/" +
    SHOP.phone.replace(/\D/g, "") +
    "?text=" +
    encodeURIComponent("Hello " + SHOP.name + "! I have a question.");
}

/* ====================================================
   5. PRODUCT FILTERS
   ==================================================== */

function renderFilters() {
  const categories = [
    "All",
    ...new Set(PRODUCTS.map(product => product.category))
  ];

  document.getElementById("categoryFilters").innerHTML =
    categories.map(category => `
      <button
        class="filter-btn ${
          activeCategory === category ? "active" : ""
        }"
        data-category="${escapeHTML(category)}"
        aria-pressed="${activeCategory === category}"
      >
        ${escapeHTML(category)}
      </button>
    `).join("");
}

document.getElementById("categoryFilters").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button) return;

  activeCategory = button.dataset.category;

  renderFilters();
  renderProducts();
});

/* ====================================================
   6. PRODUCT SEARCH AND DISPLAY
   ==================================================== */

function renderProducts() {
  const search = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const products = PRODUCTS.filter(product => {
    const categoryMatch =
      activeCategory === "All" ||
      product.category === activeCategory;

    const searchMatch =
      product.name.toLowerCase().includes(search) ||
      product.category.toLowerCase().includes(search) ||
      product.description.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  const grid = document.getElementById("productGrid");

  if (products.length === 0) {
    grid.innerHTML =
      '<div class="empty-products">No products found.</div>';
    return;
  }

  grid.innerHTML = products.map(product => `
    <article class="product-card">
      <img
        src="${escapeHTML(product.image)}"
        alt="${escapeHTML(product.alt)}"
        loading="lazy"
        width="600"
        height="400"
      >

      <div class="product-info">
        <span class="product-category">
          ${escapeHTML(product.category)}
        </span>

        <h3 class="product-name">
          ${escapeHTML(product.name)}
        </h3>

        <p class="product-description">
          ${escapeHTML(product.description)}
        </p>

        <div class="product-bottom">
          <div class="product-price">
            ${money(product.price)}
          </div>

          <button
            class="add-btn"
            data-add="${product.id}"
            aria-label="Add ${escapeHTML(product.name)} to cart"
          >
            + Add to Cart
          </button>
        </div>
      </div>
    </article>
  `).join("");
}

document.getElementById("searchInput").addEventListener("input", renderProducts);

document.getElementById("productGrid").addEventListener("click", event => {
  const button = event.target.closest("[data-add]");
  if (!button) return;

  addToCart(Number(button.dataset.add));
});

/* ====================================================
   7. CART OPERATIONS
   ==================================================== */

function addToCart(id) {
  if (!getProduct(id)) return;

  if ((cart[id] || 0) >= 99) {
    alert("Maximum quantity per product is 99.");
    return;
  }

  cart[id] = (cart[id] || 0) + 1;

  saveCart();
  renderCart();

  const button = document.querySelector(`[data-add="${id}"]`);

  if (button) {
    const originalText = button.textContent;
    button.textContent = "✓ Added!";

    setTimeout(() => {
      if (button.isConnected) {
        button.textContent = originalText;
      }
    }, 700);
  }
}

function changeQuantity(id, difference) {
  if (!getProduct(id)) return;

  const nextQuantity = (cart[id] || 0) + difference;

  if (nextQuantity <= 0) {
    delete cart[id];
  } else if (nextQuantity <= 99) {
    cart[id] = nextQuantity;
  }

  saveCart();
  renderCart();
}

function removeFromCart(id) {
  delete cart[id];
  saveCart();
  renderCart();
}

function renderCart() {
  const count = getCartCount();

  document.getElementById("headerCount").textContent = count;
  document.getElementById("floatingCount").textContent = count;

  const cartItems = document.getElementById("cartItems");
  const cartSummary = document.getElementById("cartSummary");
  const emptyNote = document.getElementById("emptyCartNote");

  const entries = Object.entries(cart).filter(([id, quantity]) =>
    getProduct(id) && quantity > 0
  );

  if (entries.length === 0) {
    cartItems.innerHTML = "";
    cartSummary.style.display = "none";
    emptyNote.style.display = "block";

    document.getElementById("checkoutForm").classList.remove("visible");
    return;
  }

  emptyNote.style.display = "none";
  cartSummary.style.display = "block";

  cartItems.innerHTML = entries.map(([id, quantity]) => {
    const product = getProduct(id);
    const subtotal = product.price * quantity;

    return `
      <div class="cart-item">
        <div>
          <h3>${escapeHTML(product.name)}</h3>
          <p>${money(product.price)} each</p>

          <div class="quantity-controls">
            <button
              data-minus="${id}"
              aria-label="Decrease quantity"
            >−</button>

            <span>${quantity}</span>

            <button
              data-plus="${id}"
              aria-label="Increase quantity"
              ${quantity >= 99 ? "disabled" : ""}
            >+</button>

            <button
              class="remove-btn"
              data-remove="${id}"
            >Remove</button>
          </div>
        </div>

        <div class="item-subtotal">
          ${money(subtotal)}
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("grandTotal").textContent =
    money(getCartTotal());
}

document.getElementById("cartItems").addEventListener("click", event => {
  const minus = event.target.closest("[data-minus]");
  const plus = event.target.closest("[data-plus]");
  const remove = event.target.closest("[data-remove]");

  if (minus) changeQuantity(Number(minus.dataset.minus), -1);
  if (plus) changeQuantity(Number(plus.dataset.plus), 1);
  if (remove) removeFromCart(Number(remove.dataset.remove));
});

/* ====================================================
   8. CART MODAL
   ==================================================== */

function openCart() {
  renderCart();

  document.getElementById("cartModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeCart() {
  document.getElementById("cartModal").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("cartModal").addEventListener("click", event => {
  if (event.target.id === "cartModal") closeCart();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeCart();
});

function showCheckout() {
  if (!getCartCount()) return;

  const form = document.getElementById("checkoutForm");

  form.classList.add("visible");

  form.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

/* ====================================================
   9. COMPLETE EMAIL ORDER SUMMARY
   ==================================================== */

function buildOrderSummary() {
  const lines = [
    "NEW CUSTOMER ORDER",
    "Shop: " + SHOP.name,
    "Location: " + SHOP.location,
    "----------------------------------------",
    "ITEMS:"
  ];

  for (const [id, quantity] of Object.entries(cart)) {
    const product = getProduct(id);

    if (!product || quantity <= 0) continue;

    lines.push(
      product.name +
      " | Quantity: " + quantity +
      " | Unit Price: " + money(product.price) +
      " | Subtotal: " + money(product.price * quantity)
    );
  }

  lines.push("----------------------------------------");
  lines.push("GRAND TOTAL: " + money(getCartTotal()));
  lines.push("");
  lines.push(
    "Customer Name: " +
    document.getElementById("customerName").value.trim()
  );
  lines.push(
    "Customer Phone: " +
    document.getElementById("customerPhone").value.trim()
  );
  lines.push(
    "Delivery Address: " +
    document.getElementById("customerAddress").value.trim()
  );
  lines.push(
    "Special Instructions: " +
    (
      document.getElementById("instructions").value.trim() ||
      "None"
    )
  );

  return lines.join("\n");
}

/* ====================================================
   10. CHECKOUT AND FORMSPREE EMAIL
   ==================================================== */

const checkoutForm = document.getElementById("checkoutForm");

checkoutForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (!getCartCount()) {
    alert("Your cart is empty.");
    return;
  }

  if (!checkoutForm.reportValidity()) return;

  const formAction = checkoutForm.getAttribute("action");

  if (formAction.includes("YOUR_FORMSPREE_FORM_ID")) {
    alert(
      "Email setup is not complete. Create a Formspree form, " +
      "then replace YOUR_FORMSPREE_FORM_ID in the HTML."
    );
    return;
  }

  const submitButton = document.getElementById("submitOrderBtn");
  const message = document.getElementById("orderMessage");

  document.getElementById("orderSummaryField").value =
    buildOrderSummary();

  document.getElementById("orderTotalField").value =
    money(getCartTotal());

  document.getElementById("emailSubject").value =
    "New Order - " + SHOP.name;

  submitButton.disabled = true;
  submitButton.textContent = "Submitting Order...";
  message.classList.remove("visible");
  message.replaceChildren();

  try {
    const response = await fetch(formAction, {
      method: "POST",
      body: new FormData(checkoutForm),
      headers: {
        Accept: "application/json"
      }
    });

    if (!response.ok) {
      throw new Error("The order could not be submitted.");
    }

    /*
      Only clear the cart after the email service accepts the order.
    */

    cart = {};
    saveCart();
    renderCart();

    checkoutForm.reset();
    checkoutForm.classList.remove("visible");

    const confirmation = document.createElement("p");

    confirmation.textContent =
      "Order placed! " + SHOP.name +
      " will contact you on WhatsApp to confirm.";

    message.appendChild(confirmation);

    const whatsappLink = document.createElement("a");

    whatsappLink.className = "whatsapp-link";
    whatsappLink.target = "_blank";
    whatsappLink.rel = "noopener noreferrer";

    whatsappLink.href =
      "https://wa.me/" +
      SHOP.phone.replace(/\D/g, "") +
      "?text=" +
      encodeURIComponent(
        "Hello " + SHOP.name +
        ", I have placed an order. Please confirm my order."
      );

    whatsappLink.textContent = "Message the shop on WhatsApp →";

    message.appendChild(whatsappLink);
    message.classList.add("visible");

    /*
      Keep confirmation visible even though the cart is empty.
    */

    document.getElementById("emptyCartNote").style.display = "none";
    document.getElementById("cartSummary").style.display = "none";
    document.getElementById("cartItems").innerHTML = "";

    message.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });

  } catch (error) {
    message.textContent =
      "We could not submit your order. Please check your connection " +
      "and try again, or contact the shop on WhatsApp.";

    message.classList.add("visible");

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Place Order";
  }
});

/* ====================================================
   11. START WEBSITE
   ==================================================== */

setupShop();
renderFilters();
renderProducts();
renderCart();
</script>

</body>
</html>
