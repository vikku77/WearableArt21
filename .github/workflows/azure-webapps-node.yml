<script>
"use strict";

/* ====================================================
   1. SHOP SETTINGS
   Replace these values with your real shop details.
   ==================================================== */

const SHOP = {
  name: "Vikas Patel Store",
  tagline: "Quality products at honest prices.",
  location: "Kanpur, Uttar Pradesh",

  // Replace with your real WhatsApp number including country code.
  // Example format: 91 followed by your 10-digit mobile number.
  phone: "919876543210",

  email: "your-email@example.com"
};

/* ====================================================
   2. PRODUCT CATALOG
   Prices and products below are examples.
   Confirm real prices and availability before publishing.
   ==================================================== */

const PRODUCTS = [
  {
    id: 1,
    name: "Aashirvaad Atta (5kg)",
    price: 280,
    category: "Groceries",
    description: "Whole wheat flour for everyday meals.",
    image: "https://placehold.co/600x400/e9f4e9/146c43?text=Atta",
